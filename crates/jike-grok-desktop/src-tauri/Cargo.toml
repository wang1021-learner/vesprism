[package]
name = "jike-grok-desktop"
version = "0.1.0"
description = "基于 Grok Build 二次开发的桌面 AI 助手"
authors = ["jike"]
license = "Apache-2.0"
edition.workspace = true
rust-version = "1.92.0"

[lib]
name = "jike_grok_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = { workspace = true }
serde = { workspace = true }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tokio = { workspace = true }
anyhow = { workspace = true }
dotenvy = "0.15"
dirs = "5"
grok-session = { workspace = true }
tauri-plugin-dialog = "2"
toml = { workspace = true }
rusqlite = { version = "0.37", features = ["bundled"] }
xai-grok-shell = { workspace = true }
chrono = { workspace = true }

