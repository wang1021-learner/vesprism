[package]
name = "vesprism-desktop"
version = "0.1.0"
description = "Vesprism — AI 原生桌面开发工作台"
authors = ["vesprism"]
license = "Apache-2.0"
edition.workspace = true
rust-version = "1.92.0"

[lib]
name = "vesprism_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = { workspace = true }
serde = { workspace = true }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tokio = { workspace = true }
anyhow = { workspace = true }
dotenvy = "0.15"
dirs = "5"
grok-session = { workspace = true }
tauri-plugin-dialog = "2"
toml = { workspace = true }
rusqlite = { version = "0.37", features = ["bundled"] }
xai-grok-shell = { workspace = true }
xai-fast-worktree = { path = "../../codegen/xai-fast-worktree", features = ["metadata"] }
chrono = { workspace = true }
zip = { workspace = true }
serde_yaml = { workspace = true }
base64 = { workspace = true }
portable-pty = { workspace = true }
xai-grok-mcp = { workspace = true }
reqwest = { workspace = true }
png = "0.17"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

